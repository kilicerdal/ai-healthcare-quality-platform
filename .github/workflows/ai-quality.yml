name: AI Quality Validation

on:
  push:
    branches:
      - fix/platform-reliability-20261013
  pull_request:

jobs:
  ai-quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit reliability checks
        run: npm run test:unit

      - name: Validate JavaScript syntax
        run: |
          node --check framework/ai/aiSelfHealing.js
          node --check framework/ai/aiTestDataGenerator.js
          node --check framework/ai/aiRiskPrioritizer.js
          node --check framework/ai/aiOpenAPIAnalyzer.js
          node --check framework/reporters/aiQualityDashboard.js

      - name: Validate OpenAPI specification
        run: |
          node -e "JSON.parse(require('fs').readFileSync('openapi/healthcare-api.json')); console.log('OpenAPI valid')"

      - name: Run deterministic AI validation tests
        run: |
          npx playwright test \
            tests/ai/businessRuleValidation.spec.js \
            tests/ai/aiCoverageValidator.spec.js \
            tests/ai/aiCoverageNegativeValidation.spec.js \
            tests/ai/aiCoverageConflictingValidation.spec.js \
            tests/ai/aiCoverageRuleMismatch.spec.js \
            tests/ai/aiDuplicateCoverageDetector.spec.js \
            --reporter=list \
            --workers=1

      - name: Generate AI quality dashboard
        run: node scripts/generateAIQualityDashboard.js

      - name: Upload quality dashboard
        uses: actions/upload-artifact@v7
        with:
          name: ai-quality-dashboard
          path: reports/ai-quality-dashboard/

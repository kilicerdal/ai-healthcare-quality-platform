name: Demo environment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Unit reliability checks
        run: npm run test:unit
      - run: npm run demo:up
      - run: npm run demo:test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compose-test-report
          path: |
            playwright-report/
            test-results/
      - run: docker compose logs
        if: failure()
      - run: npm run demo:down
        if: always()
